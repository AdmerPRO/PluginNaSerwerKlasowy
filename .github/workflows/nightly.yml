name: Paper Plugin Nightly

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Paper Plugin
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build plugin
        run: ./gradlew clean build --no-daemon

      - name: Find JAR
        id: jar
        shell: bash
        run: |
          JAR=$(find build/libs -maxdepth 1 -type f -name "*.jar" ! -name "*-sources.jar" ! -name "*-javadoc.jar" | head -n 1)

          if [ -z "$JAR" ]; then
            echo "JAR not found!"
            exit 1
          fi

          echo "Found: $JAR"
          echo "jar=$JAR" >> "$GITHUB_OUTPUT"

      - name: Delete previous nightly release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete nightly \
            --repo "${{ github.repository }}" \
            --yes \
            || true

      - name: Create nightly release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create nightly \
            "${{ steps.jar.outputs.jar }}" \
            --repo "${{ github.repository }}" \
            --title "Nightly Build" \
            --notes "Automated nightly build from commit ${{ github.sha }}" \
            --prerelease
